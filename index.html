<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ampliare Prospecção Inteligente</title><style>
:root{--p:#7c3aed;--p2:#5b21b6;--bg:#f7f7fb;--card:#fff;--ink:#211d29;--muted:#777280;--line:#e8e4ee;--dark:#17151d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:#17151d;color:#fff;padding:22px 15px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 28px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#a855f7,#6d28d9);display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:17px}.brand span{display:block;font-size:10px;color:#aaa3b2;margin-top:2px}.nav button{width:100%;border:0;background:none;color:#aaa3b2;padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#27232f;color:#fff}.nav b{display:inline-flex;background:#352c43;border-radius:15px;font-size:9px;padding:3px 6px;margin-left:5px}.bottom{margin-top:auto}.user{border-top:1px solid #302c35;padding:18px 8px 0;display:flex;gap:10px;align-items:center}.user>div{width:32px;height:32px;border-radius:50%;background:#8b5cf6;display:grid;place-items:center;font-weight:800}.user span{font-size:11px}.user small{color:#aaa}.main{margin-left:245px;width:calc(100% - 245px);padding:28px 38px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:#8b8494}.head h1{font-size:26px;margin:5px 0 0}.system{font-size:12px;color:#6e6977}.system i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:6px}.hero{background:#17151d;border-radius:23px;color:#fff;min-height:370px;padding:42px;display:flex;position:relative;overflow:hidden}.heroText{max-width:670px;position:relative;z-index:2}.pill{display:inline-flex;gap:7px;background:#2b2633;color:#c4a7ff;border-radius:30px;padding:7px 11px;font-size:11px;font-weight:700}.hero h2{font-size:42px;line-height:1.04;letter-spacing:-.035em;margin:20px 0 13px;max-width:650px}.hero p{color:#bcb6c5;line-height:1.6;max-width:610px}.search{background:#fff;border-radius:12px;padding:6px;display:flex;max-width:680px;margin-top:25px}.search input{flex:1;border:0;outline:0;padding:0 12px;font-size:14px;min-width:0}.search button,.primary{background:var(--p);border:0;color:#fff;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer}.hint{font-size:11px;color:#a8a2af;margin-top:9px}.hint button{border:0;background:none;color:#c4a7ff;cursor:pointer}.orb{position:absolute;right:95px;top:95px;width:205px;height:205px;border:1px solid #5c5268;border-radius:50%;box-shadow:0 0 0 38px #221f29,0 0 0 78px #1d1a22}.score{position:absolute;right:137px;top:139px;width:122px;height:122px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#4c1d95);display:grid;place-content:center;text-align:center;box-shadow:0 18px 45px #0008}.score b{font-size:36px}.score span{font-size:8px;letter-spacing:.1em}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.feature,.panel,.metric,.settings,.outreach,.quick,.historyRow,.lead{background:#fff;border:1px solid var(--line);border-radius:15px}.feature{padding:17px}.fi{width:34px;height:34px;border-radius:9px;background:#f0eaff;color:var(--p2);display:grid;place-items:center;font-weight:900}.feature h3{font-size:13px;margin:12px 0 5px}.feature p{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.quick{margin-top:15px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.quick span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.page{padding-bottom:40px}.back{border:0;background:none;color:#6d28d9;font-weight:700;cursor:pointer;padding:0 0 15px}.company{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;display:flex;align-items:center;gap:13px}.companyLogo{width:52px;height:52px;border-radius:14px;background:#ede9fe;color:#6d28d9;display:grid;place-items:center;font-size:22px;font-weight:900}.company h2{margin:0 0 4px}.company p{margin:0;color:var(--muted);font-size:12px}.tag{font-size:9px;font-weight:800;color:#18824a;margin-bottom:4px}.bigscore{margin-left:auto;border-left:1px solid var(--line);padding-left:25px;text-align:right}.bigscore b{font-size:30px;color:#6d28d9;display:block}.bigscore span{font-size:10px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.metric{padding:13px}.metric span{font-size:10px;color:var(--muted);display:block}.metric b{display:block;font-size:13px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{padding:18px}.pt{display:flex;gap:8px;align-items:center;margin-bottom:12px}.pt .ico{color:var(--p2);font-weight:900}.pt h3{font-size:14px;margin:0}.info{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #f0edf3;padding:11px 0;font-size:11px}.info span{color:var(--muted)}.info b{text-align:right;max-width:65%;word-break:break-word}.opp{display:flex;gap:9px;border-top:1px solid #f0edf3;padding:11px 0;font-size:12px;line-height:1.4}.opp b{width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:#fff0d9;color:#b45309;display:grid;place-items:center;font-size:10px}.recommend h3{font-size:16px;line-height:1.35}.recommend p{color:var(--muted);font-size:11px;line-height:1.5}.copy{border:0;background:#f0eafa;color:#5b21b6;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.source{font-size:10px;color:#9a94a1;margin:12px 2px}.outreach{margin-top:12px;padding:20px}.outHead{display:flex;justify-content:space-between}.outHead h2{margin:4px 0 0;font-size:20px}.badge{background:#f0eafa;color:#6d28d9;border-radius:20px;padding:7px 10px;font-size:10px;font-weight:800;height:max-content}.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:15px}.tabs button{border:0;background:none;padding:10px 13px;color:#777;cursor:pointer;font-weight:700;font-size:12px}.tabs button.sel{color:#6d28d9;border-bottom:2px solid #7c3aed}.message{margin-top:13px;background:#faf9fc;border:1px solid #eeeaf3;border-radius:12px;padding:15px;display:flex;justify-content:space-between;gap:15px}.message small{color:#999;font-size:9px;font-weight:800;text-transform:uppercase}.message p{white-space:pre-wrap;font-size:13px;line-height:1.6;margin:6px 0 0}.save{margin-top:12px}.toast{position:fixed;right:22px;top:20px;background:#17151d;color:#fff;padding:11px 15px;border-radius:10px;font-size:12px;z-index:50}.pipelineTop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:15px}.pipelineTop h2{margin:0}.pipelineTop span{font-size:12px;color:var(--muted)}.stats{display:flex;gap:7px}.stats div{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:10px;text-align:center}.stats b{display:block}.stats span{font-size:9px}.kanban{display:grid;grid-template-columns:repeat(7,190px);gap:9px;overflow:auto;padding-bottom:8px}.col{background:#efedf4;border-radius:12px;padding:8px;min-height:260px}.colhead{display:flex;justify-content:space-between;padding:5px;font-size:11px}.colhead span{background:#fff;border-radius:15px;padding:2px 6px}.lead{padding:11px;margin-bottom:8px}.lead .top{display:flex;justify-content:space-between}.lead .top button{border:0;background:none;color:#aaa;cursor:pointer}.lead h4{margin:7px 0 3px;font-size:12px}.lead p{font-size:10px;color:var(--muted);line-height:1.4;margin:0 0 8px}.lead strong{font-size:15px;color:#6d28d9}.lead small{font-size:8px;color:#999}.lead .open{width:100%;border:1px solid #ddd7e8;background:#faf9fc;border-radius:7px;padding:6px;margin:8px 0;font-size:10px;font-weight:700;cursor:pointer}.lead select{width:100%;border:1px solid #ddd7e8;border-radius:7px;padding:5px;font-size:10px}.empty{background:#fff;border:1px dashed #d9d3e1;border-radius:16px;text-align:center;padding:55px;color:var(--muted)}.empty h3{color:var(--ink);margin:10px 0 4px}.historyRow{width:100%;display:flex;align-items:center;text-align:left;padding:13px;margin-bottom:8px;cursor:pointer;gap:11px}.historyRow .small{width:38px;height:38px;font-size:15px}.historyRow div:nth-child(2){flex:1}.historyRow b{display:block;font-size:13px}.historyRow span{font-size:10px;color:var(--muted)}.historyRow strong{color:#6d28d9}.settings{padding:22px;max-width:760px}.setting{display:grid;grid-template-columns:1fr 1.5fr auto;gap:14px;border-top:1px solid #eee;padding:15px 0;font-size:12px}.setting span{color:var(--muted)}.setting em{font-style:normal;font-size:9px;background:#f0edf6;border-radius:20px;padding:5px 8px}.ok{color:#18824a!important;background:#e9f8ef!important}@media(max-width:1000px){.features{grid-template-columns:1fr 1fr}.orb,.score{display:none}.hero h2{font-size:34px}.grid{grid-template-columns:1fr}.main{padding:22px}.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}}@media(max-width:680px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:17px}.brand{padding-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.bottom{display:none}.head{margin-bottom:18px}.head h1{font-size:21px}.system{display:none}.hero{padding:25px 20px}.hero h2{font-size:29px}.search{flex-wrap:wrap}.search input{height:42px;width:100%;flex-basis:100%}.search button{width:100%}.features,.metrics{grid-template-columns:1fr 1fr}.company{align-items:flex-start;flex-wrap:wrap}.bigscore{margin-left:0;border-left:0;padding-left:0;text-align:left}.quick,.pipelineTop{display:block}.quick .primary{margin-top:10px;width:100%}.stats{overflow:auto;margin-top:12px}.message{display:block}.message .copy{margin-top:10px}.setting{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const STATUSES=['Novo','Contato','Respondeu','Reunião','Proposta','Fechado','Perdido'];let page='dashboard',query='',result=null,leads=[],tab='whatsapp';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt);let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||'Erro na operação');return d}
async function load(){try{leads=await api('/api/leads')}catch{leads=[]}render()}
function shell(body){document.querySelector('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">A</div><div><b>Ampliare</b><span>Prospecção Inteligente</span></div></div><nav class="nav"><button class="${page==='dashboard'?'active':''}" onclick="go('dashboard')">⌂ &nbsp; Nova análise</button><button class="${page==='pipeline'?'active':''}" onclick="go('pipeline')">▦ &nbsp; Pipeline <b>${leads.length}</b></button><button class="${page==='history'?'active':''}" onclick="go('history')">◷ &nbsp; Histórico</button></nav><div class="bottom"><nav class="nav"><button class="${page==='settings'?'active':''}" onclick="go('settings')">⚙ &nbsp; Configurações</button></nav><div class="user"><div>A</div><span>Agência<br><small>Ampliare Performance</small></span></div></div></aside><main class="main"><header class="head"><div><span class="eyebrow">CENTRAL DE PROSPECÇÃO</span><h1>${page==='dashboard'?'Encontre sua próxima oportunidade':page==='analysis'?'Análise da empresa':page==='pipeline'?'Pipeline comercial':page==='history'?'Histórico de análises':'Configurações'}</h1></div><div class="system"><i></i>Sistema operacional</div></header>${body}</main></div>`}
function go(p){page=p;render()}
function render(){if(page==='dashboard')return shell(dashboard());if(page==='analysis')return shell(analysis());if(page==='pipeline')return shell(pipeline());if(page==='history')return shell(history());return shell(settings())}
function dashboard(){return `<section class="page"><div class="hero"><div class="heroText"><span class="pill">✦ IA para prospecção B2B</span><h2>Descubra onde sua próxima venda está escondida.</h2><p>Informe o CNPJ ou nome da empresa. A plataforma cruza dados cadastrais, presença digital e sinais comerciais para preparar uma abordagem personalizada.</p><div class="search"><input id="q" value="${esc(query)}" placeholder="Digite CNPJ ou nome da empresa..."><button onclick="analyze()">Analisar empresa →</button></div><div class="hint">Teste rápido: <button onclick="fillDemo()">Good Sleep Colchões</button> ou informe um CNPJ para dados cadastrais oficiais.</div></div><div class="orb"></div><div class="score"><b>87</b><span>OPORTUNIDADE</span></div></div><div class="features"><div class="feature"><div class="fi">CNPJ</div><h3>Raio-X empresarial</h3><p>Dados cadastrais, segmento, porte e situação.</p></div><div class="feature"><div class="fi">WEB</div><h3>Auditoria digital</h3><p>Site, Google, conversão e presença online.</p></div><div class="feature"><div class="fi">ADS</div><h3>Sinais de mídia</h3><p>Status transparente, sem inventar ausência de anúncios.</p></div><div class="feature"><div class="fi">AI</div><h3>Copiloto comercial</h3><p>WhatsApp, e-mail e DM personalizados.</p></div></div><div class="quick"><div><b>Já analisou empresas?</b><span>Acompanhe cada oportunidade no pipeline comercial.</span></div><button class="primary" onclick="go('pipeline')">Ver pipeline →</button></div></section>`}
function fillDemo(){$('#q').value='Good Sleep Colchões';query='Good Sleep Colchões'}
async function analyze(){query=$('#q').value.trim();if(!query)return;const b=$('.search button');b.disabled=true;b.textContent='Analisando...';try{result=await api('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});const saved={...result,id:crypto.randomUUID(),status:'Novo',createdAt:new Date().toISOString()};leads=[saved,...leads.filter(x=>x.company?.cnpj!==result.company?.cnpj)];localStorage.setItem('ampliare_leads',JSON.stringify(leads));page='analysis';render();toast('Análise concluída e lead salvo.')}catch(e){toast(e.message)}finally{if($('.search button')){$('.search button').disabled=false;$('.search button').textContent='Analisar empresa →'}}}
function companyName(){const c=result?.company||{};return c.tradeName||c.company||result?.company||'Empresa'}
function analysis(){if(!result)return dashboard();const c=result.company||{},g=result.digital?.google,w=result.website;return `<section class="page"><button class="back" onclick="go('dashboard')">← Nova análise</button><div class="company"><div class="companyLogo">${esc(companyName()[0])}</div><div><div class="tag">● ${esc(c.status||'ANALISADA')}</div><h2>${esc(companyName())}</h2><p>${esc(c.cnpj||'CNPJ não informado')} · ${esc(c.segment||'Segmento não identificado')} · ${esc(c.city||'Local não identificado')}</p></div><div class="bigscore"><b>${result.score||'—'}</b><span>Score de oportunidade</span></div></div><div class="metrics"><div class="metric"><span>Porte</span><b>${esc(c.size||'Não disponível')}</b></div><div class="metric"><span>Abertura</span><b>${esc(c.opening||'Não disponível')}</b></div><div class="metric"><span>Telefone</span><b>${esc(c.phone||'Não disponível')}</b></div><div class="metric"><span>Google</span><b>${g?.rating?`${g.rating} ★ (${g.userRatingCount||0})`:'Não identificado'}</b></div></div><div class="grid"><div class="panel"><div class="pt"><span class="ico">◆</span><h3>Raio-X da empresa</h3></div>${info('CNPJ',c.cnpj||'Não informado')}${info('Segmento',c.segment||'Não disponível')}${info('Situação',c.status||'Não disponível')}${info('Faturamento','Não disponível sem fonte confiável')}</div><div class="panel"><div class="pt"><span class="ico">◉</span><h3>Presença digital</h3></div>${info('Site',w?.domain||g?.website||'Não identificado')}${info('Google',g?.rating?`${g.rating} ★ · ${g.userRatingCount||0} avaliações`:'Não identificado')}${info('Anúncios',result.ads?.status||'Não conectado')}${info('Site auditado',w?.found?`${w.status} · HTTPS ${w.https?'sim':'não'}`:'Não auditado')}</div><div class="panel"><div class="pt"><span class="ico">!</span><h3>Pontos de oportunidade</h3></div>${(result.opportunities||[]).map((x,i)=>`<div class="opp"><b>${i+1}</b><span>${esc(x)}</span></div>`).join('')}</div><div class="panel recommend"><div class="pt"><span class="ico">◎</span><h3>O que vender</h3></div><h3>${esc(result.recommendation)}</h3><p>Recomendação comercial baseada nos sinais encontrados; não é garantia de resultado.</p><button class="copy" onclick="copyText(result.recommendation)">Copiar plano</button></div></div><div class="source">Fontes: ${esc(result.sources?.cnpj||'—')}${result.sources?.google?' · '+esc(result.sources.google):''}</div>${outreach()}<button class="primary save" onclick="saveAgain()">＋ Salvar/atualizar no pipeline</button></section>`}
function info(a,b){return `<div class="info"><span>${esc(a)}</span><b>${esc(b)}</b></div>`}
function outreach(){const o=result.outreach||{};let content=tab==='whatsapp'?o.whatsapp:tab==='email'?o.email:o.dm;return `<div class="outreach"><div class="outHead"><div><span class="eyebrow">COPILOTO COMERCIAL</span><h2>Abordagem pronta para enviar</h2></div><span class="badge">✦ Personalizada por IA</span></div><div class="tabs"><button class="${tab==='whatsapp'?'sel':''}" onclick="setTab('whatsapp')">WhatsApp</button><button class="${tab==='email'?'sel':''}" onclick="setTab('email')">E-mail</button><button class="${tab==='dm'?'sel':''}" onclick="setTab('dm')">Instagram / DM</button></div><div class="message"><div><small>${tab}</small><p>${esc(content||'Este canal ainda não foi gerado. Conecte a OpenAI no .env do servidor para geração completa.')}</p></div><button class="copy" onclick="copyText(${JSON.stringify(content||'')})">Copiar</button></div></div>`}
function setTab(t){tab=t;render()}
async function saveAgain(){const d={...result,id:crypto.randomUUID(),status:'Novo',createdAt:new Date().toISOString()};leads=[d,...leads];localStorage.setItem('ampliare_leads',JSON.stringify(leads));toast('Lead atualizado no pipeline.')}
function pipeline(){return `<section class="page"><div class="pipelineTop"><div><h2>Oportunidades</h2><span>${leads.length} leads salvos</span></div><div class="stats">${STATUSES.slice(0,5).map(s=>`<div><b>${leads.filter(l=>l.status===s).length}</b><span>${s}</span></div>`).join('')}</div></div>${!leads.length?empty():`<div class="kanban">${STATUSES.map(s=>`<div class="col"><div class="colhead"><b>${s}</b><span>${leads.filter(l=>l.status===s).length}</span></div>${leads.filter(l=>l.status===s).map(leadCard).join('')}</div>`).join('')}</div>`}</section>`}
function leadCard(l){const n=l.company?.tradeName||l.company?.company||l.company||'Empresa';return `<div class="lead"><div class="top"><div class="companyLogo" style="width:32px;height:32px;font-size:14px">${esc(n[0])}</div><button onclick="removeLead('${l.id}')">×</button></div><h4>${esc(n)}</h4><p>${esc(l.company?.segment||l.segment||'Segmento não informado')}</p><strong>${l.score||'—'} <small>score</small></strong><button class="open" onclick="openLead('${l.id}')">Abrir análise →</button><select onchange="status('${l.id}',this.value)">${STATUSES.map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`}
function history(){return `<section class="page"><div class="listIntro" style="margin-bottom:12px"><b>${leads.length} registros</b></div>${leads.map(l=>{const n=l.company?.tradeName||l.company?.company||l.company||'Empresa';return `<button class="historyRow" onclick="openLead('${l.id}')"><div class="companyLogo" style="width:38px;height:38px;font-size:15px">${esc(n[0])}</div><div><b>${esc(n)}</b><span>${esc(l.company?.segment||l.segment||'')} · ${esc(l.company?.city||l.city||'')}</span></div><strong>${l.score||'—'}</strong>›</button>`}).join('')}${!leads.length?empty():''}</section>`}
function settings(){return `<section class="page"><div class="settings"><h2>Configuração do servidor</h2><p style="color:#777;font-size:13px;line-height:1.6">As chaves de API ficam no arquivo <code>.env</code> do servidor. Nunca coloque chaves secretas no frontend.</p>${setting('BrasilAPI / Minha Receita','Consulta cadastral por CNPJ sem chave.','Ativo','ok')}${setting('Google Places API (New)','Pesquisa por nome, ficha local e website.','Opcional')}${setting('OpenAI Responses API','Geração de WhatsApp, e-mail e DM com IA.','Opcional')}${setting('Meta Ads','Não conectado. O sistema não inventa ausência de anúncios.','Futuro')}</div></section>`}
function setting(a,b,c,cl=''){return `<div class="setting"><b>${a}</b><span>${b}</span><em class="${cl}">${c}</em></div>`}
function empty(){return `<div class="empty"><div style="font-size:30px">◎</div><h3>Nenhum lead salvo ainda</h3><p>Faça uma análise e o lead entra automaticamente no pipeline.</p></div>`}
function openLead(id){result=leads.find(x=>x.id===id);page='analysis';render()}
async function status(id,s){leads=leads.map(x=>x.id===id?{...x,status:s}:x);localStorage.setItem('ampliare_leads',JSON.stringify(leads));render()}
async function removeLead(id){leads=leads.filter(x=>x.id!==id);localStorage.setItem('ampliare_leads',JSON.stringify(leads));render();toast('Lead removido.')}
async function copyText(t){try{await navigator.clipboard.writeText(t||'')}catch{}toast('Texto copiado.')}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
load();
</script></body></html>
